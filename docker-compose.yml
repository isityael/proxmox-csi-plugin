services:
  base:
    image: k8s.gcr.io/pause:3.10
    ports:
      - "8080:8080"
  plugin:
    build:
      context: .
      target: develop
    network_mode: "service:base"
    environment:
      # NODE_NAME: worker-11
      KUBECONFIG: /etc/kubernetes/kubeconfig
      # UNSAFEMOUNT: "true"
    command:
      - "make"
      - "run"
    volumes:
      - type: volume
        source: socket-dir
        target: /csi
      - type: bind
        source: ./hack
        target: /etc/kubernetes
      - type: bind
        source: ./
        target: /src
      - type: bind
        source: ../proxmox
        target: /proxmox
  csi-attacher:
    # https://github.com/kubernetes-csi/external-attacher
    image: dhi.io/csi-attacher:4.12.0-debian13-dev
    restart: always
    network_mode: "service:base"
    command:
      - "--v=5"
      - "--csi-address=unix:///csi/csi.sock"
      - "--leader-election=false"
      - "--timeout=1m"
      - "--default-fstype=ext4"
      - "--kubeconfig=/etc/kubernetes/kubeconfig"
    volumes:
      - type: volume
        source: socket-dir
        target: /csi
      - type: bind
        source: ./hack
        target: /etc/kubernetes
  csi-resizer:
    # https://github.com/kubernetes-csi/external-resizer
    image: dhi.io/csi-resizer:2.2.1-debian13-dev
    restart: always
    network_mode: "service:base"
    command:
      - "--v=5"
      - "--workers=1"
      - "--csi-address=unix:///csi/csi.sock"
      - "--leader-election=false"
      - "--timeout=1m"
      - "--kubeconfig=/etc/kubernetes/kubeconfig"
      # - "--feature-gates=VolumeAttributesClass=true"
    volumes:
      - type: volume
        source: socket-dir
        target: /csi
      - type: bind
        source: ./hack
        target: /etc/kubernetes
  csi-snapshotter:
    # https://github.com/kubernetes-csi/external-snapshotter
    image: dhi.io/csi-snapshotter:8.6.0-debian13-dev
    restart: always
    network_mode: "service:base"
    command:
      - "--v=5"
      - "--worker-threads=1"
      - "--csi-address=unix:///csi/csi.sock"
      - "--leader-election=false"
      - "--kubeconfig=/etc/kubernetes/kubeconfig"
    volumes:
      - type: volume
        source: socket-dir
        target: /csi
      - type: bind
        source: ./hack
        target: /etc/kubernetes
  csi-provisioner:
    # https://github.com/kubernetes-csi/external-provisioner
    image: dhi.io/csi-provisioner:6.3.0-debian13-dev
    restart: always
    network_mode: "service:base"
    command:
      - "--v=5"
      - "--csi-address=unix:///csi/csi.sock"
      - "--leader-election=false"
      - "--timeout=1m"
      - "--default-fstype=ext4"
      # - "--feature-gates=VolumeAttributesClass=true"
      - "--enable-capacity"
      - "--capacity-ownerref-level=-1"
      - "--capacity-poll-interval=2m"
      # - "--extra-create-metadata=true"
      # - "--node-deployment"
      - "--kubeconfig=/etc/kubernetes/kubeconfig"
    environment:
      NAMESPACE: csi-proxmox
      POD_NAME: csi-provisioner
      # NODE_NAME: worker-11
    volumes:
      - type: volume
        source: socket-dir
        target: /csi
      - type: bind
        source: ./hack
        target: /etc/kubernetes
  # csi-node-driver-registrar:
  #   image: dhi.io/csi-node-driver-registrar:2.17.0-debian13-dev
  #   network_mode: "service:base"
  #   command:
  #     - "--v=5"
  #     - "--csi-address=unix:///csi/csi.sock"
  #     - "--kubelet-registration-path=/var/lib/kubelet/plugins/csi.proxmox.sinextra.dev/csi.sock"
  #   environment:
  #     KUBE_NODE_NAME: worker-11
  #   volumes:
  #     - type: volume
  #       source: socket-dir
  #       target: /csi
  #     - type: bind
  #       source: ./hack
  #       target: /etc/kubernetes

volumes:
  socket-dir:
