name: HelmChart Release

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"

jobs:
  build-publish:
    # Fork releases are published by Woodpecker to Forgejo.
    if: github.repository == 'sergelogvinov/proxmox-csi-plugin'
    name: "Publish helm chart"
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.1
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Github registry login
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Helm release
        timeout-minutes: 5
        run: make helm-login helm-release
        env:
          HELM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
