# proxmox-csi-plugin - CI: Go verification and compile checks
when:
  - event: pull_request
  - event: push
    branch:
      - main
  - event: manual

steps:
  - name: restore-go-cache
    image: plugins/cache:1.10@sha256:1ff8584ff4e1d245fbb5e19350901c8f995cf2f32f2618f687445e8535003121
    failure: ignore
    settings:
      access_key: {from_secret: garage_s3_access_key}
      secret_key: {from_secret: garage_s3_secret_key}
      restore: true
      backend: s3
      endpoint: http://garage.garage.svc.cluster.local:3900
      bucket: buildkit-cache
      region: garage
      path_style: true
      archive_format: zstd
      cache_key: 'woodpecker/proxmox-csi-plugin/go/amd64/go1.26-{{ checksum "go.sum" }}'
      mount: [.go-mod-cache]

  - name: chart-version-guard
    image: ghcr.io/isityael/chart-version-guard:main@sha256:fcfaa83ad6b20fc7e0f15e7ca128fc0d36816bf38ef7fff40526fb3924b557e8
    commands:
      - chart-version-guard check --ci woodpecker --repo .

  - name: test
    image: dhi.io/golang:1.26.7-debian13-dev@sha256:ff7c1ae3a8a313f76147a8d6299b20e49bcf5ee1cf0cfec84a8b1b3e66e589a9
    environment:
      GOMODCACHE: ${CI_WORKSPACE}/.go-mod-cache
    commands:
      - mkdir -p "$${GOMODCACHE}"
      - |
        go mod download
        if ! go mod verify; then
          echo "Module cache verification failed; rebuilding the cache"
          go clean -modcache
          go mod download
          go mod verify
        fi
      - go test -timeout=5m -tags=unit $(go list ./...)

  - name: build
    image: dhi.io/golang:1.26.7-debian13-dev@sha256:ff7c1ae3a8a313f76147a8d6299b20e49bcf5ee1cf0cfec84a8b1b3e66e589a9
    environment:
      GOMODCACHE: ${CI_WORKSPACE}/.go-mod-cache
    commands:
      - mkdir -p "$${GOMODCACHE}"
      - mkdir -p bin
      - |
        SHA="$(git describe --match=none --always --abbrev=7 --dirty)"
        TAG="$(git describe --tag --always --match 'v[0-9]*')"

        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
          -ldflags "-w -s -X main.version=$${TAG} -X main.commit=$${SHA}" \
          -o bin/proxmox-csi-controller-amd64 ./cmd/controller

        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
          -ldflags "-w -s -X main.version=$${TAG} -X main.commit=$${SHA}" \
          -o bin/proxmox-csi-node-amd64 ./cmd/node

        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
          -ldflags "-w -s -X main.version=$${TAG} -X main.commit=$${SHA}" \
          -o bin/pvecsictl-amd64 ./cmd/pvecsictl

  - name: rebuild-go-cache
    image: plugins/cache:1.10@sha256:1ff8584ff4e1d245fbb5e19350901c8f995cf2f32f2618f687445e8535003121
    failure: ignore
    when:
      - event: push
        branch: main
    settings:
      access_key: {from_secret: garage_s3_access_key}
      secret_key: {from_secret: garage_s3_secret_key}
      rebuild: true
      backend: s3
      endpoint: http://garage.garage.svc.cluster.local:3900
      bucket: buildkit-cache
      region: garage
      path_style: true
      archive_format: zstd
      cache_key: 'woodpecker/proxmox-csi-plugin/go/amd64/go1.26-{{ checksum "go.sum" }}'
      mount: [.go-mod-cache]
