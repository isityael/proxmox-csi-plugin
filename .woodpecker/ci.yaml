# proxmox-csi-plugin - CI: Go verification and compile checks
when:
  - event: pull_request
  - event: push
    branch:
      - main
  - event: manual

# Go caches live on the shared woodpecker-pipeline-cache volume (as in infra):
# the Garage archive was 1.8 GB and its restore + rebuild cost ~3 min of a
# ~5.5 min run. Tests and builds wait for the read-only module consistency gate.
steps:
  - name: go-mod-check
    image: dhi.io/golang:1.27.3-debian13-dev
    depends_on: []
    commands:
      - go mod tidy -diff

  - name: chart-version-guard
    image: git.m0sh1.cc/isityael/chart-version-guard:v0.1.0-ym.17
    depends_on: []
    commands:
      - chart-version-guard check --ci woodpecker --repo .

  - name: test
    image: dhi.io/golang:1.27.3-debian13-dev
    depends_on: [go-mod-check]
    volumes:
      - woodpecker-pipeline-cache:/woodpecker/cache
    environment:
      GOFLAGS: -mod=readonly
      GOMODCACHE: /woodpecker/cache/proxmox-csi-plugin/go-mod
      GOCACHE: /woodpecker/cache/proxmox-csi-plugin/go-build
    commands:
      - mkdir -p "$${GOMODCACHE}" "$${GOCACHE}"
      - |
        go mod download
        if ! go mod verify; then
          echo "Module cache verification failed; rebuilding the cache"
          go clean -modcache
          go mod download
          go mod verify
        fi
      - git diff --exit-code -- go.mod go.sum
      - go test -timeout=5m -tags=unit ./...

  - name: build
    image: dhi.io/golang:1.27.3-debian13-dev
    depends_on: [go-mod-check]
    volumes:
      - woodpecker-pipeline-cache:/woodpecker/cache
    environment:
      GOFLAGS: -mod=readonly
      GOMODCACHE: /woodpecker/cache/proxmox-csi-plugin/go-mod
      GOCACHE: /woodpecker/cache/proxmox-csi-plugin/go-build
    commands:
      - mkdir -p "$${GOMODCACHE}" "$${GOCACHE}"
      - mkdir -p bin
      - |
        SHA="$(git describe --match=none --always --abbrev=7 --dirty)"
        TAG="$(git describe --tag --always --match 'v[0-9]*')"

        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
          -ldflags "-w -s -X main.version=$${TAG} -X main.commit=$${SHA}" \
          -o bin/proxmox-csi-controller-amd64 ./cmd/controller

        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
          -ldflags "-w -s -X main.version=$${TAG} -X main.commit=$${SHA}" \
          -o bin/proxmox-csi-node-amd64 ./cmd/node

        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
          -ldflags "-w -s -X main.version=$${TAG} -X main.commit=$${SHA}" \
          -o bin/pvecsictl-amd64 ./cmd/pvecsictl
