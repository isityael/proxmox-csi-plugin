# proxmox-csi-plugin - CI: Go verification and compile checks
when:
  - event: pull_request
  - event: push
    branch:
      - main
  - event: manual

steps:
  - name: release-policy
    image: dhi.io/bash:5.3.11-alpine3.23@sha256:80b5c46618a7c71b76cd5fa2228422a927bf6af2a51a617f1ef03a226d8e5861
    commands:
      - .ci/test-release-policy.sh

  - name: chart-version-guard
    image: ghcr.io/isityael/chart-version-guard:main@sha256:53c5c274ba46c7244e6cb99b78a3adc4476a24403d34a7980c5f0ce75e6ff939
    commands:
      - chart-version-guard check --ci woodpecker --repo .

  - name: test
    image: dhi.io/golang:1.26.5-debian13-dev@sha256:4f8306e798384952c56c754db2ef72f075413a73a0bcf512890fe43d58f315de
    environment:
      GOMODCACHE: /tmp/go/pkg/mod
      GO_CACHE_ARCHIVE: /woodpecker/cache/proxmox-csi-plugin/go-modcache.tar
    volumes:
      - woodpecker-pipeline-cache:/woodpecker/cache
    commands:
      - mkdir -p "$${GOMODCACHE}" "$$(dirname "$${GO_CACHE_ARCHIVE}")"
      - '[ ! -f "$${GO_CACHE_ARCHIVE}" ] || tar -xf "$${GO_CACHE_ARCHIVE}" -C /tmp/go'
      - |
        go mod download
        if ! go mod verify; then
          echo "Module cache verification failed; rebuilding the cache"
          go clean -modcache
          go mod download
          go mod verify
        fi
      - go test -timeout=5m -tags=unit $(go list ./...)
      - |
        CACHE_TMP="$${GO_CACHE_ARCHIVE}.tmp.$${CI_PIPELINE_NUMBER}"
        tar -cf "$${CACHE_TMP}" -C /tmp/go pkg/mod
        mv "$${CACHE_TMP}" "$${GO_CACHE_ARCHIVE}"

  - name: build
    image: dhi.io/golang:1.26.5-debian13-dev@sha256:4f8306e798384952c56c754db2ef72f075413a73a0bcf512890fe43d58f315de
    environment:
      GOMODCACHE: /tmp/go/pkg/mod
      GO_CACHE_ARCHIVE: /woodpecker/cache/proxmox-csi-plugin/go-modcache.tar
    volumes:
      - woodpecker-pipeline-cache:/woodpecker/cache
    commands:
      - mkdir -p "$${GOMODCACHE}"
      - '[ ! -f "$${GO_CACHE_ARCHIVE}" ] || tar -xf "$${GO_CACHE_ARCHIVE}" -C /tmp/go'
      - mkdir -p bin
      - |
        SHA="$(git describe --match=none --always --abbrev=7 --dirty)"
        TAG="$(git describe --tag --always --match 'v[0-9]*')"

        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
          -ldflags "-w -s -X main.version=$${TAG} -X main.commit=$${SHA}" \
          -o bin/proxmox-csi-controller-amd64 ./cmd/controller

        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
          -ldflags "-w -s -X main.version=$${TAG} -X main.commit=$${SHA}" \
          -o bin/proxmox-csi-node-amd64 ./cmd/node

        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
          -ldflags "-w -s -X main.version=$${TAG} -X main.commit=$${SHA}" \
          -o bin/pvecsictl-amd64 ./cmd/pvecsictl
