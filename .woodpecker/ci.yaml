# proxmox-csi-plugin - CI: Go verification and compile checks
when:
  - event: pull_request
  - event: push
    branch:
      - main
  - event: manual

steps:
  - name: restore-go-cache
    image: plugins/cache:1.10@sha256:f108c65d14edfba45f4c75fd606d4bf5886babc38ffdd6183a599234004edfc0
    failure: ignore
    settings:
      access_key: {from_secret: garage_s3_access_key}
      secret_key: {from_secret: garage_s3_secret_key}
      restore: true
      backend: s3
      endpoint: http://garage.garage.svc.cluster.local:3900
      bucket: buildkit-cache
      region: garage
      path_style: true
      archive_format: zstd
      cache_key: 'woodpecker/proxmox-csi-plugin/go/amd64/go1.26-{{ checksum "go.sum" }}'
      mount: [.go-mod-cache, .go-build-cache]

  - name: chart-version-guard
    image: ghcr.io/isityael/chart-version-guard:main@sha256:e0c8ca189d0b0c96c51d06c911d846b0ab4a93103fa1f75c7015e0e79da914f6
    commands:
      - chart-version-guard check --ci woodpecker --repo .

  - name: test
    image: dhi.io/golang:1.27.1-debian13-dev@sha256:9b23f00c5b36018b72742352c391e78c200193eea59c81d7043a19193a1a6a4b
    commands:
      # CI_WORKSPACE only exists at step runtime, so it must be expanded here
      # (escaped) rather than in environment:, where it would be empty.
      - export GOMODCACHE="$${CI_WORKSPACE}/.go-mod-cache" GOCACHE="$${CI_WORKSPACE}/.go-build-cache"
      - mkdir -p "$${GOMODCACHE}" "$${GOCACHE}"
      - |
        go mod download
        if ! go mod verify; then
          echo "Module cache verification failed; rebuilding the cache"
          go clean -modcache
          go mod download
          go mod verify
        fi
      - go test -timeout=5m -tags=unit $(go list ./...)

  - name: build
    image: dhi.io/golang:1.27.1-debian13-dev@sha256:9b23f00c5b36018b72742352c391e78c200193eea59c81d7043a19193a1a6a4b
    commands:
      # CI_WORKSPACE only exists at step runtime, so it must be expanded here
      # (escaped) rather than in environment:, where it would be empty.
      - export GOMODCACHE="$${CI_WORKSPACE}/.go-mod-cache" GOCACHE="$${CI_WORKSPACE}/.go-build-cache"
      - mkdir -p "$${GOMODCACHE}" "$${GOCACHE}"
      - mkdir -p bin
      - |
        SHA="$(git describe --match=none --always --abbrev=7 --dirty)"
        TAG="$(git describe --tag --always --match 'v[0-9]*')"

        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
          -ldflags "-w -s -X main.version=$${TAG} -X main.commit=$${SHA}" \
          -o bin/proxmox-csi-controller-amd64 ./cmd/controller

        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
          -ldflags "-w -s -X main.version=$${TAG} -X main.commit=$${SHA}" \
          -o bin/proxmox-csi-node-amd64 ./cmd/node

        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
          -ldflags "-w -s -X main.version=$${TAG} -X main.commit=$${SHA}" \
          -o bin/pvecsictl-amd64 ./cmd/pvecsictl

  - name: rebuild-go-cache
    image: plugins/cache:1.10@sha256:f108c65d14edfba45f4c75fd606d4bf5886babc38ffdd6183a599234004edfc0
    failure: ignore
    when:
      - event: push
        branch: main
    settings:
      access_key: {from_secret: garage_s3_access_key}
      secret_key: {from_secret: garage_s3_secret_key}
      rebuild: true
      backend: s3
      endpoint: http://garage.garage.svc.cluster.local:3900
      bucket: buildkit-cache
      region: garage
      path_style: true
      archive_format: zstd
      cache_key: 'woodpecker/proxmox-csi-plugin/go/amd64/go1.26-{{ checksum "go.sum" }}'
      mount: [.go-mod-cache, .go-build-cache]
